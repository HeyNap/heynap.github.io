<!doctype html>
<!--
  The app icon, composed from the Icon Composer layers (appicon/icon-composer.icon,
  copied into icon-layers/) the way Icon Composer lights them: sky-blue ground,
  the white face as a lit disk with a soft shadow, the features with their white
  emboss, the Zs and the curl on top with a shadow of their own colour.
  Rendered at 1024 by tools/build-assets.sh:
    ?shape=full      full bleed (iOS and Android mask it themselves)
    ?shape=rounded   iOS's rounded square, corners transparent (the page, favicons)
    ?shape=maskable  full bleed, artwork pulled into Android's safe zone
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .icon {
    position: relative; width: 1024px; height: 1024px; overflow: hidden;
    background: linear-gradient(180deg,
      color(display-p3 0.529 0.839 1) 0%,
      color(display-p3 0.416 0.780 0.988) 45%,
      color(display-p3 0.373 0.761 0.973) 80%);
  }
  .rounded .icon { border-radius: 229px; }
  .rounded .icon::after {
    /* the lit rim Icon Composer draws around the shape */
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 3px 6px rgba(255,255,255,.55), inset 0 -2px 6px rgba(255,255,255,.25);
  }
  .art { position: absolute; inset: 0; }
  .maskable .art { transform: scale(.86); }
  .art img { position: absolute; inset: 0; width: 1024px; height: 1024px; }
  .disk {
    position: absolute; left: 172px; top: 172px; width: 700px; height: 700px; border-radius: 50%;
    background:
      radial-gradient(120% 90% at 42% 22%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(180deg,
        color(display-p3 0.973 0.988 0.996) 0%,
        color(display-p3 0.925 0.965 0.992) 45%,
        color(display-p3 0.788 0.906 0.973) 100%);
    box-shadow:
      0 18px 40px rgba(10, 60, 110, .28),
      0 4px 10px rgba(10, 60, 110, .12),
      inset 0 -6px 14px rgba(255,255,255,.6),
      inset 0 2px 2px rgba(255,255,255,.9);
  }
  .features { opacity: .92; }
  .top img { filter: drop-shadow(0 10px 9px rgba(0,0,0,.22)); }
  .z { opacity: .82; }
</style>
<body>
  <div class="icon">
    <div class="art">
      <div class="disk"></div>
      <div class="features">
        <img src="icon-layers/Slice-1-5.svg" alt="">
        <img src="icon-layers/Slice-1-6.svg" alt="">
        <img src="icon-layers/Slice-1-7.svg" alt="">
      </div>
      <div class="top">
        <img src="icon-layers/Slice-1-4.svg" alt="">
        <img class="z" src="icon-layers/Slice-1-2.svg" alt="">
        <img class="z" src="icon-layers/Slice-1-3.svg" alt="">
        <img class="z" src="icon-layers/Slice-1.svg" alt="">
      </div>
    </div>
  </div>
  <script>
    document.body.className = new URLSearchParams(location.search).get('shape') || 'full';
  </script>
</body>
